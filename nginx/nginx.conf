user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    access_log /var/log/nginx/access.log;

    # Tăng giới hạn kích thước body của request, quan trọng cho việc upload file
    client_max_body_size 128M;

    server {
        listen 80;
        server_name localhost;

        # ---- 1. Cấu hình Proxy cho WebSocket của Odoo ----
        # Ưu tiên kiểm tra location này trước
        location /websocket/ {
            proxy_pass http://odoo_app:8069;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # Giữ kết nối lâu hơn
        }
        
        # ---- 2. Cấu hình Proxy cho TẤT CẢ các endpoint của Odoo ----
        # Đây là khối được sửa đổi quan trọng nhất.
        # Nó bắt tất cả các đường dẫn mà Odoo sử dụng cho web client và RPC.
        location ~ ^/(web|longpolling|odoo|jsonrpc|mail|base_setup|auth_signup|web/dataset/call_kw|web/session/logout|web/binary/company_logo)(/.*)?$ {
            proxy_pass http://odoo_app:8069;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # ---- 3. Cấu hình cho API tùy chỉnh (dùng cho React) ----
        # Giữ nguyên khối này để phục vụ React App của bạn
        location /api/ {
            # Thêm các header CORS
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;

            # Xử lý preflight request
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://odoo_app:8069/; # Cắt bỏ /api/ khi chuyển tiếp
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # ---- 4. Cấu hình cho Frontend React (SPA) ----
        # Block này sẽ xử lý tất cả các request còn lại
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}