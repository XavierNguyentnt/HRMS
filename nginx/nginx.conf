# File: nginx.conf

# Cấu hình worker processes và các file log cơ bản
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Cài đặt upstream cho Odoo để dễ quản lý và cân bằng tải (nếu cần)
    upstream odoo_backend {
    server odoo:8069;
    }
    upstream odoo_longpolling {
        server odoo:8072;
    }

    server {
        listen 80;
        server_name localhost;

        # Tăng giới hạn dung lượng file upload và thời gian chờ
        client_max_body_size 200M;
        proxy_read_timeout 720s;

        # === PROXY CHO LONGPOLLING ===
        location /longpolling/ {
            proxy_pass http://odoo_longpolling;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # === PROXY CHO TẤT CẢ CÁC YÊU CẦU CÒN LẠI (ODOO + REACT API) ===
        location / {
            proxy_pass http://odoo_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Xử lý CORS cho các API call từ React
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;

            # Xử lý preflight request
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    
        
        # === 3. PHỤC VỤ REACT FRONTEND (TẤT CẢ CÁC YÊU CẦU CÒN LẠI) ===
        location / {
            root /usr/share/nginx/html; # Đường dẫn đến thư mục build của React trong container
            try_files $uri /index.html;
        }
    }
}