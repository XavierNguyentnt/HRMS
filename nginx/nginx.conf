user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name localhost;

        # ---- 1. Cấu hình cho WebSocket ----
        # Ưu tiên kiểm tra location này trước
        location /websocket/ {
            proxy_pass http://odoo_app:8069/websocket/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
        
        # ---- 2. Cấu hình chung cho tất cả API của Odoo ----
        location /api/ {
            # Add CORS headers. The origin should match your frontend's address.
            # For production, you should change 'http://localhost:3000' to your frontend's domain.
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;

            # Handle preflight OPTIONS requests by returning 204
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://odoo_app:8069/; # Cắt bỏ /api/ khi chuyển tiếp
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 3. Cấu hình cho Frontend React (SPA) ----
        # Xử lý tất cả các request còn lại
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html; # Rất quan trọng cho React Router
        }
    }
}