# File: nginx.conf

# Cấu hình worker processes và các file log cơ bản
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Cài đặt upstream cho Odoo để dễ quản lý và cân bằng tải (nếu cần)
    upstream odoo_backend {
        server odoo:8069;
    }
    upstream odoo_longpolling {
        server odoo:8072;
    }

    # Cấu hình chính cho server
    server {
        listen 80;
        server_name localhost;

        # Cài đặt log riêng cho server này
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Tăng giới hạn dung lượng file upload
        client_max_body_size 200M;
        
        # Tăng thời gian chờ cho các kết nối dài
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;

        # === 1. PROXY CHO LONGPOLLING (CHAT, LIVE NOTIFICATION) ===
        location /longpolling/ {
            proxy_pass http://odoo_longpolling;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === 2. PROXY CHO TẤT CẢ CÁC YÊU CẦU API VÀ ODOO BACKEND ===
        # Bắt tất cả các đường dẫn đến Odoo và API tùy chỉnh của bạn
        location ~ ^/(web|api|jsonrpc|odoo)/ {
            proxy_pass http://odoo_backend;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Script-Name /odoo;

            # Xử lý CORS chỉ cho các API call từ React
            if ($request_uri ~* "/api/") {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With' always;
                
                # Xử lý preflight request
                if ($request_method = 'OPTIONS') {
                    return 204;
                }
            }
        }
        
        # === 3. PHỤC VỤ REACT FRONTEND (TẤT CẢ CÁC YÊU CẦU CÒN LẠI) ===
        location / {
            root /usr/share/nginx/html; # Đường dẫn đến thư mục build của React trong container
            try_files $uri /index.html;
        }
    }
}