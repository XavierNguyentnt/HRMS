map $http_origin $cors_header {
    ~^http://localhost(:3000)?$ $http_origin;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 128M;

    # Redirect /odoo -> /odoo/
    location = /odoo {
        return 301 /odoo/;
    }

    # =========================
    # Backend Odoo UI (/odoo/)
    # =========================
    location /odoo/ {
        proxy_pass http://odoo:8069;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Static files
    # =========================
    location /odoo/web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 90d;
        proxy_pass http://odoo:8069/web/static/;
    }

    location /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 90d;
        proxy_pass http://odoo:8069/web/static/;
    }

    # =========================
    # API & longpolling: hỗ trợ cả /web/... và /odoo/web/...
    # =========================
    location ~ ^/(web|jsonrpc|base_setup|mail|report|longpolling)(/.*)?$ {
        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_header always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        if ($uri ~* "longpolling") {
            proxy_pass http://odoo:8072;
        }
        if ($uri !~* "longpolling") {
            proxy_pass http://odoo:8069;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/odoo/(web|jsonrpc|base_setup|mail|report|longpolling)(/.*)?$ {
        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_header always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        if ($uri ~* "longpolling") {
            proxy_pass http://odoo:8072;
        }
        if ($uri !~* "longpolling") {
            proxy_pass http://odoo:8069;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Alias /api/... -> /web/...
    # =========================
    location ~ ^/api/(.*)$ {
        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_header always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, X-Auth-Token, Origin, Authorization, Accept' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://odoo:8069/web/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển tiếp các request có dạng /api/ai/ đến service bff-api
    # ========================================================
    # ƯU TIÊN TUYỆT ĐỐI CHO BFF API
    # ^~ : Nếu khớp, dừng tìm kiếm và dùng ngay block này.
    # ========================================================
    location ^~ /api/ai/ {
        # proxy_pass đến đúng service và port của bff-api
        proxy_pass http://bff-api:8000;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Các header cần thiết để chuyển tiếp thông tin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        # Đường dẫn root trỏ đến thư mục build của React app
        root /usr/share/nginx/html;
        # Ưu tiên tìm file/folder trùng với URI trước
        try_files $uri /index.html;
    }
}
